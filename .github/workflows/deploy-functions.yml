# Deploys the Supabase edge functions whenever their code changes on main.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

concurrency: supabase-functions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hnjejflinvaoxbduxeiu
    steps:
      - uses: actions/checkout@v4
      - name: Check for access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret to deploy functions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every function file parses
        run: npm install --no-save --silent typescript@5 && node tools/check-functions.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Both functions check their own credentials (API keys, user sessions, Paystack signatures),
      # so Supabase's JWT gate stays off.
      - run: supabase functions deploy delivrie --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - run: supabase functions deploy billing --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - run: supabase functions deploy automations --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Check the API is up after deploying
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$PROJECT_REF.supabase.co/functions/v1/delivrie/public/status")
            [ "$code" = "200" ] && { echo "API is up"; exit 0; }
            echo "API answered $code, retrying…"; sleep 10
          done
          echo "::error::The API isn't starting after this deploy. Check the function logs, then fix or redeploy the previous commit."; exit 1
