# Tests the integrations in integrations/ on every change: the Zapier app, the n8n nodes (built against
# n8n-workflow), the Auth0 action, the Make app definition and the agent plugin manifests.
# Run by hand with "publish_n8n" to publish n8n-nodes-delivrie to npm (with provenance, which n8n's verification
# needs) using the NPM_TOKEN secret, and with "push_zapier" to push the Zapier app using ZAPIER_DEPLOY_KEY.
name: Integrations

on:
  push:
    branches: [main]
    paths: ["integrations/**", ".claude-plugin/**", ".cursor-plugin/**", ".agents/**", ".github/workflows/integrations.yml"]
  pull_request:
    paths: ["integrations/**"]
  workflow_dispatch:
    inputs:
      publish_n8n:
        description: Publish integrations/n8n to npm as n8n-nodes-delivrie
        type: boolean
        default: false
      push_zapier:
        description: Push integrations/zapier to Zapier (needs ZAPIER_DEPLOY_KEY)
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zapier app
        working-directory: integrations/zapier
        run: npm install --no-audit --no-fund && npm test && node -e "const a=require('./index.js'); if(!a.triggers.email_event||!a.creates.send_email) process.exit(1)"
      - name: n8n nodes
        working-directory: integrations/n8n
        run: npm install --no-audit --no-fund && npm run build && node -e "require('./dist/nodes/Delivrie/Delivrie.node.js'); require('./dist/nodes/Delivrie/DelivrieTrigger.node.js'); require('./dist/credentials/DelivrieApi.credentials.js')"
      - name: Auth0 action
        working-directory: integrations/auth0
        run: node test.mjs
      - name: JSON files parse (Make app, plugin manifests, marketplaces)
        run: |
          for f in $(find integrations .claude-plugin .cursor-plugin .agents -name '*.json' -o -name '*.imljson' | grep -v node_modules); do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

  publish-n8n:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish_n8n && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/n8n
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::Add the NPM_TOKEN repository secret to publish."; exit 1; fi
          v="$(node -p 'require("./package.json").version')"
          if npm view "n8n-nodes-delivrie@$v" version >/dev/null 2>&1; then echo "::notice::n8n-nodes-delivrie@$v is already on npm. Bump the version to publish again."; exit 0; fi
          npm install --no-audit --no-fund
          npm run build
          npm publish --provenance --access public

  push-zapier:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.push_zapier && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: integrations/zapier
    env:
      ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ -z "$ZAPIER_DEPLOY_KEY" ]; then echo "::error::Add the ZAPIER_DEPLOY_KEY secret (developer.zapier.com → Settings → Deploy keys)."; exit 1; fi
          npm install --no-audit --no-fund
          npx -y zapier-platform-cli@latest validate
          if [ ! -f .zapierapprc ]; then
            # First push: create the (private) integration on Zapier, then keep its id in the repo.
            npx -y zapier-platform-cli@latest register "Delivrie" \
              --desc "Email API for transactional email, broadcasts, automations and an inbox. Send email and sync contacts from any app." \
              --url "https://delivrie.io" --audience private --role employee --category email --no-subscribe --yes
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .zapierapprc && git commit -m "Zapier: keep the registered integration id" && git push
          fi
          npx -y zapier-platform-cli@latest push
