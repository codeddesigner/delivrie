# Certificate for smtp.delivrie.io on port 587 (STARTTLS). Ports 465/2465 use Fly's own certificate.
# Gets a Let's Encrypt certificate with a DNS check in Cloudflare, stores it as Fly secrets (which restarts the relay),
# then checks 587 end to end. Runs monthly; certificates last 90 days.
# Needs repository secrets: FLY_API_TOKEN and CLOUDFLARE_DNS_API_TOKEN (Cloudflare token with Zone → DNS → Edit on delivrie.io).
name: SMTP certificate

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

concurrency: smtp-relay

jobs:
  certificate:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CF_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
      APP: delivrie-smtp
      HOSTNAME: smtp.delivrie.io
      LEGO_VERSION: v4.19.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::Add the FLY_API_TOKEN repository secret."; exit 1; }
          [ -n "$CF_DNS_API_TOKEN" ] || { echo "::error::Add the CLOUDFLARE_DNS_API_TOKEN repository secret (Cloudflare → My Profile → API Tokens → Edit zone DNS, zone delivrie.io)."; exit 1; }
      - name: Get the certificate
        run: |
          curl -sSL "https://github.com/go-acme/lego/releases/download/${LEGO_VERSION}/lego_${LEGO_VERSION}_linux_amd64.tar.gz" | tar -xz lego
          ./lego --accept-tos --email support@delivrie.io --dns cloudflare --dns.resolvers 1.1.1.1:53 --domains "$HOSTNAME" --path ./certs run
          openssl x509 -in "certs/certificates/$HOSTNAME.crt" -noout -subject -enddate
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Install it on the relay
        working-directory: smtp
        run: |
          flyctl secrets set --app "$APP" --stage \
            TLS_CERT="$(cat ../certs/certificates/$HOSTNAME.crt)" \
            TLS_KEY="$(cat ../certs/certificates/$HOSTNAME.key)"
          flyctl deploy --app "$APP" --remote-only --ha=false
      - name: Check port 587
        env:
          SMTP_CHECK_587: "1"
        run: |
          for i in 1 2 3 4 5 6; do node smtp/smoke.mjs "$HOSTNAME" && exit 0; echo "relay still restarting, retrying…"; sleep 15; done; exit 1
